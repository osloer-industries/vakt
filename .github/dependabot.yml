version: 2
updates:
  # Bun (package.json + bun.lock)
  - package-ecosystem: "bun"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "bun"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      bun-dependencies:
        patterns:
          - "*"

  # GitHub Actions (including uses: osloer-industries/.github/.github/workflows/...@<sha> reusable refs)
  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
