name: Pull request title

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-title:
    uses: osloer-industries/.github/.github/workflows/semantic-pull-request.yml@a6ee91211fd9ba096ec141bacdb67985a82b6767 # v0.1.7
    permissions:
      pull-requests: read