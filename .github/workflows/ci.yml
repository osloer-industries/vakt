name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-security:
    uses: osloer-industries/.github/.github/workflows/workflow-security.yml@a6ee91211fd9ba096ec141bacdb67985a82b6767 # v0.1.7
    permissions:
      contents: read
      actions: read

  build:
    uses: osloer-industries/.github/.github/workflows/node-npm-quality.yml@a6ee91211fd9ba096ec141bacdb67985a82b6767 # v0.1.7
    with:
      package-manager: bun
      job-name: build
      check-npm-script: ci:build
      timeout-minutes: 15

  lint:
    uses: osloer-industries/.github/.github/workflows/node-npm-quality.yml@a6ee91211fd9ba096ec141bacdb67985a82b6767 # v0.1.7
    with:
      package-manager: bun
      job-name: lint
      check-npm-script: ci:lint

  test:
    uses: osloer-industries/.github/.github/workflows/node-npm-quality.yml@a6ee91211fd9ba096ec141bacdb67985a82b6767 # v0.1.7
    with:
      package-manager: bun
      job-name: test
      check-npm-script: ci:test

  security:
    uses: osloer-industries/.github/.github/workflows/node-npm-quality.yml@a6ee91211fd9ba096ec141bacdb67985a82b6767 # v0.1.7
    with:
      package-manager: bun
      job-name: security
      check-npm-script: ci:security

  mutation:
    uses: osloer-industries/.github/.github/workflows/mutation-changed.yml@a6ee91211fd9ba096ec141bacdb67985a82b6767 # v0.1.7
    with:
      package-manager: bun
      full-npm-script: test:mutation
      timeout-minutes: 20

  agents-md-lint:
    uses: osloer-industries/.github/.github/workflows/agents-md-lint.yml@a6ee91211fd9ba096ec141bacdb67985a82b6767 # v0.1.7

  codeql:
    uses: osloer-industries/.github/.github/workflows/codeql-javascript-typescript.yml@a6ee91211fd9ba096ec141bacdb67985a82b6767 # v0.1.7
    permissions:
      contents: read
      actions: read
      security-events: write

  sonar-analyze:
    uses: osloer-industries/.github/.github/workflows/sonarqube-cloud-node.yml@a6ee91211fd9ba096ec141bacdb67985a82b6767 # v0.1.7
    permissions:
      contents: read
      pull-requests: read
    with:
      package-manager: bun
      coverage-npm-script: test:coverage
      timeout-minutes: 20
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  sonar-zero-open-issues:
    if: github.event_name == 'pull_request'
    needs: sonar-analyze
    uses: osloer-industries/.github/.github/workflows/sonarcloud-zero-issues.yml@a6ee91211fd9ba096ec141bacdb67985a82b6767 # v0.1.7
    with:
      project-key: tn819_agentctl
      ce-task-id: ${{ needs.sonar-analyze.outputs.ce-task-id }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build Docker e2e harness
        run: docker compose -f tests/docker/docker-compose.yml build

      - name: Run Docker e2e harness
        run: |
          docker compose -f tests/docker/docker-compose.yml up \
            --abort-on-container-exit \
            --exit-code-from vakt

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f tests/docker/docker-compose.yml logs

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install bats
        run: brew install bats-core

      - name: Run e2e tests (excluding Docker sandbox suite)
        run: |
          set -euo pipefail
          export PATH="$PWD/src:$HOME/.bun/bin:$PATH"
          export AGENTS_SECRETS_BACKEND=env
          bats_files=()
          while IFS= read -r file; do
            bats_files+=("$file")
          done < <(find tests/e2e -maxdepth 1 -name '*.bats' ! -name 'agent-docker.bats' | sort)
          bats "${bats_files[@]}"

      - name: Build binary (smoke test prerequisite)
        run: bun build src/index.ts --compile --outfile dist/vakt

      - name: Run binary smoke tests
        run: |
          export AGENTS_SECRETS_BACKEND=env
          bats tests/e2e/binary.bats

      - name: Test CLI commands
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          export AGENTS_DIR="$HOME/.agents-test"
          export AGENTS_SECRETS_BACKEND=env

          bun run src/index.ts init
          [ -d "$AGENTS_DIR" ]
          [ -f "$AGENTS_DIR/config.json" ]

          bun run src/index.ts config list
          bun run src/index.ts config set paths.code ~/Projects

          bun run src/index.ts secrets set TEST_KEY "test_value"
          [ "$(bun run src/index.ts secrets get TEST_KEY)" = "test_value" ]

          bun run src/index.ts add-server test npx -y test-mcp
          bun run src/index.ts list servers | grep -q "test"

          bun run src/index.ts list

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install bats
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bats

      - name: Create kind cluster for Kata kubectl e2e
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: vakt-ci

      - name: Setup Docker
        run: |
          if ! docker info &>/dev/null; then
            echo "Starting Docker daemon..."
            sudo systemctl start docker
            sleep 5
          fi
          docker info
          docker run --rm hello-world

      - name: Run e2e tests
        run: |
          export PATH="$PWD/src:$HOME/.bun/bin:$PATH"
          export AGENTS_SECRETS_BACKEND=env
          bats tests/e2e/

      - name: Build binary (smoke test prerequisite)
        run: bun build src/index.ts --compile --outfile dist/vakt

      - name: Run binary smoke tests
        run: |
          export AGENTS_SECRETS_BACKEND=env
          bats tests/e2e/binary.bats

      - name: Test CLI commands
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          export AGENTS_DIR="$HOME/.agents-test"
          export AGENTS_SECRETS_BACKEND=env

          bun run src/index.ts init
          [ -d "$AGENTS_DIR" ]
          [ -f "$AGENTS_DIR/config.json" ]

          bun run src/index.ts config list
          bun run src/index.ts config set paths.code ~/Projects

          bun run src/index.ts secrets set TEST_KEY "test_value"
          [ "$(bun run src/index.ts secrets get TEST_KEY)" = "test_value" ]

          bun run src/index.ts add-server test npx -y test-mcp
          bun run src/index.ts list servers | grep -q "test"

          bun run src/index.ts list

  ci-passed:
    name: ci-passed
    needs:
      - workflow-security
      - build
      - lint
      - test
      - security
      - mutation
      - agents-md-lint
      - docker-e2e
      - test-macos
      - test-linux
      - codeql
      - sonar-analyze
      - sonar-zero-open-issues
    if: always()
    uses: osloer-industries/.github/.github/workflows/ci-passed.yml@a6ee91211fd9ba096ec141bacdb67985a82b6767 # v0.1.7
    with:
      needs-json: ${{ toJSON(needs) }}