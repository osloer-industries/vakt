name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-security:
    uses: osloer-industries/.github/.github/workflows/workflow-security.yml@d4865a4b2c70c8433188f5200beac104b1c7fe86 # main
    permissions:
      contents: read
      actions: read

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      - name: Validate JSON files
        run: |
          set -euo pipefail
          find . -name "*.json" -not -path "*/node_modules/*" -type f -print0 |
            while IFS= read -r -d '' file; do
              python3 -m json.tool "$file" > /dev/null
            done

      - name: Validate workflow YAML
        run: |
          set -euo pipefail
          find .github/workflows -name "*.yml" -type f -print0 |
            while IFS= read -r -d '' file; do
              python3 -c 'import yaml, sys; yaml.safe_load(open(sys.argv[1]))' "$file"
            done

      - name: Validate shell scripts syntax
        run: |
          set -euo pipefail
          find . -name "*.sh" -not -path "*/node_modules/*" -type f -print0 |
            while IFS= read -r -d '' file; do
              bash -n "$file"
            done

      - name: Check skill files
        run: |
          for skill_dir in skills/*/; do
            [ -f "$skill_dir/SKILL.md" ] || (echo "Missing SKILL.md in $skill_dir" && exit 1)
            grep -q "^---" "$skill_dir/SKILL.md" || (echo "Missing YAML frontmatter in $skill_dir/SKILL.md" && exit 1)
          done

      - name: Check CLI entry point responds
        run: |
          bun run src/index.ts --version
          bun run src/index.ts --help

      - name: Check installer script
        run: |
          chmod +x install.sh
          grep -q "#!/usr/bin/env bash" install.sh
          grep -q "curl" install.sh || grep -q "git clone" install.sh

  sonarcloud:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate coverage report
        run: bun test --coverage --coverage-reporter lcov

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build Docker e2e harness
        run: docker compose -f tests/docker/docker-compose.yml build

      - name: Run Docker e2e harness
        run: |
          docker compose -f tests/docker/docker-compose.yml up \
            --abort-on-container-exit \
            --exit-code-from vakt

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f tests/docker/docker-compose.yml logs
