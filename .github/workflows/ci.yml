name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-security:
    uses: osloer-industries/.github/.github/workflows/workflow-security.yml@d4865a4b2c70c8433188f5200beac104b1c7fe86 # main
    permissions:
      contents: read
      actions: read

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      - name: Validate JSON files
        run: |
          for file in $(find . -name "*.json" -not -path "*/node_modules/*" -type f); do
            python3 -m json.tool "$file" > /dev/null || (echo "Invalid JSON: $file" && exit 1)
          done

      - name: Validate workflow YAML
        run: |
          for file in $(find .github/workflows -name "*.yml" -type f); do
            python3 -c "import yaml, sys; yaml.safe_load(open('$file'))" || (echo "Invalid YAML: $file" && exit 1)
          done

      - name: Validate shell scripts syntax
        run: |
          for file in $(find . -name "*.sh" -not -path "*/node_modules/*" -type f); do
            bash -n "$file" || (echo "Syntax error in: $file" && exit 1)
          done

      - name: Check skill files
        run: |
          for skill_dir in skills/*/; do
            [ -f "$skill_dir/SKILL.md" ] || (echo "Missing SKILL.md in $skill_dir" && exit 1)
            grep -q "^---" "$skill_dir/SKILL.md" || (echo "Missing YAML frontmatter in $skill_dir/SKILL.md" && exit 1)
          done

      - name: Check CLI entry point responds
        run: |
          bun run src/index.ts --version
          bun run src/index.ts --help

      - name: Check installer script
        run: |
          chmod +x install.sh
          grep -q "#!/usr/bin/env bash" install.sh
          grep -q "curl" install.sh || grep -q "git clone" install.sh

  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate coverage report
        run: bun test --coverage --coverage-reporter lcov

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@ffc3010689be73b8e5ae0c57ce35968afd7909e8 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Build Docker e2e harness
        run: docker compose -f tests/docker/docker-compose.yml build

      - name: Run Docker e2e harness
        run: |
          docker compose -f tests/docker/docker-compose.yml up \
            --abort-on-container-exit \
            --exit-code-from vakt

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f tests/docker/docker-compose.yml logs
