name: Auto-merge

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  auto-merge:
    uses: osloer-industries/.github/.github/workflows/auto-merge.yml@a8a5a86a440228a743f0d2be6c683643e5ace478 # v0.1.8
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    with:
      release-app-id: ${{ vars.OSLOER_RELEASE_APP_ID }}
      merge-method: squash
      allow-release-prs: false
      allow-dependabot: true