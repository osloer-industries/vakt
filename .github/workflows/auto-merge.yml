name: Auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: auto-merge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auto-merge:
    if: github.event.pull_request.draft == false
    uses: osloer-industries/.github/.github/workflows/auto-merge.yml@348b254ef112f4f8e239a41e7adb3f3e2dac3944 # v0.1.6
    with:
      release-app-id: ${{ vars.OSLOER_RELEASE_APP_ID }}
      merge-method: squash
      allow-release-prs: true
      allow-dependabot: true
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}