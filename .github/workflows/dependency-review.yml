  pull_request:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    permissions:
      contents: read
      actions: read
      pull-requests: read
      security-events: write
